name: Apply V9 upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: restore
        name: Restore V9 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .v9-upload ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .v9-upload/chunk_* | base64 -d > /tmp/pixel-memory-world-v9.zip
          rm -rf /tmp/v9
          mkdir -p /tmp/v9
          unzip -q /tmp/pixel-memory-world-v9.zip -d /tmp/v9
          cp -a /tmp/v9/pixel-memory-world-v9/. .
          rm -rf .v9-upload
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit V9
        if: steps.restore.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade to V9: realtime rooms and WeChat mini program"
          git push
